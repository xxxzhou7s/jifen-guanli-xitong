<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>积分管理系统</title>
<style>html,body{margin:0;min-height:100%;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fb}body{display:grid;place-items:center}.box{text-align:center;color:#667085}.logo{width:52px;height:52px;margin:0 auto 14px;border-radius:15px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:26px}.box a{color:#2563eb;text-decoration:none;font-weight:700}</style>
</head>
<body>
<div class="box"><div class="logo">★</div><div>正在进入积分管理系统…</div><p><a href="/app.html">如果没有自动进入，点击这里</a></p></div>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(()=>navigator.serviceWorker.ready).then(()=>location.replace('/app.html')).catch(()=>location.replace('/app.html'));
}else{location.replace('/app.html')}
</script>
</body>
</html>
